<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12213f">
<title>자체 실행반</title>
<link rel="stylesheet" href="assets/app.css?v=20261119a">
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="brand">
      <span class="logo">실</span>
      <div>
        <h1>자체 실행반</h1>
        <p id="periodLine" class="period">기간 (11/1 ~ 11/29)</p>
      </div>
    </div>
    <div class="topbar-actions">
      <button id="refreshBtn" class="icon-btn" title="새로고침" aria-label="새로고침">↻</button>
      <button id="settingsBtn" class="icon-btn" title="설정" aria-label="설정">⚙</button>
    </div>
  </header>

  <div id="modeBanner" class="banner">
    <span class="dot"></span>
    <span id="modeText">시연 모드 — 기기에만 저장됩니다</span>
    <button id="connectBtn" class="banner-btn">시트 연결</button>
  </div>

  <div class="month-strip">
    <div id="monthChips" class="chips"></div>
  </div>

  <section class="summary card">
    <div class="ring-wrap">
      <svg class="ring" viewBox="0 0 120 120" aria-hidden="true">
        <circle class="ring-bg" cx="60" cy="60" r="52"></circle>
        <circle id="ringFill" class="ring-fill" cx="60" cy="60" r="52"></circle>
      </svg>
      <div class="ring-label">
        <strong id="sumRate">0%</strong>
        <span>전체 달성률</span>
      </div>
    </div>
    <div class="summary-stats">
      <div class="stat">
        <strong id="sumMembers">0</strong><span>참여 인원</span>
      </div>
      <div class="stat">
        <strong id="sumChecks">0</strong><span>총 체크</span>
      </div>
      <div class="stat">
        <strong id="sumRenew">0</strong><span>다음 달 연장</span>
      </div>
      <div class="stat stat-wide">
        <strong id="sumWeek">이번 주</strong><span id="sumWeekSub">3주차</span>
      </div>
    </div>
  </section>

  <section class="card chart-card">
    <div class="card-head">
      <h2>개인별 진도</h2>
      <span id="chartHint" class="hint">막대를 누르면 해당 참가자로 이동</span>
    </div>
    <div id="chart" class="chart"></div>
  </section>

  <section class="list-head">
    <h2>참가자 <span id="listCount" class="count">0</span></h2>
    <button id="addBtn" class="ghost-btn">+ 참여자 추가</button>
  </section>

  <div id="memberList" class="member-list"></div>

  <div class="footer-actions">
    <button id="rolloverBtn" class="primary-btn">다음 달 이월 미리보기</button>
    <a class="link-btn" href="guide.html">설치 가이드 (1분)</a>
  </div>

  <p class="foot-note">시트 원본: <span id="sheetLabel">26년 11월 자체 실행반</span></p>
</div>

<!-- 설정 -->
<div id="settingsSheet" class="sheet-backdrop" hidden>
  <div class="sheet">
    <div class="sheet-handle"></div>
    <h2>설정</h2>

    <label class="field">
      <span>Apps Script 웹앱 URL</span>
      <input id="apiUrlInput" type="url" inputmode="url" placeholder="https://script.google.com/macros/s/.../exec" autocomplete="off" spellcheck="false">
      <small>Code.gs를 시트에 붙이고 웹앱으로 배포하면 나오는 주소입니다.</small>
    </label>

    <div class="row-actions">
      <button id="testBtn" class="ghost-btn">연결 테스트</button>
      <button id="saveUrlBtn" class="primary-btn small">저장</button>
      <button id="clearUrlBtn" class="ghost-btn danger">연결 해제</button>
    </div>
    <p id="testResult" class="test-result"></p>

    <label class="field">
      <span>내 이름 (내 행 강조)</span>
      <input id="myNameInput" type="text" placeholder="예: 박종익" autocomplete="off">
      <small>입력하면 목록 맨 위에 내 카드가 고정됩니다.</small>
    </label>

    <div class="settings-info">
      <div><span>모드</span><strong id="infoMode">시연</strong></div>
      <div><span>시트</span><strong id="infoSheet">26년 11월 자체 실행반</strong></div>
      <div><span>스냅샷</span><strong id="infoSnapshot">2026-11-19</strong></div>
    </div>

    <div class="row-actions">
      <a class="ghost-btn" href="guide.html">설치 가이드</a>
      <button id="resetDemoBtn" class="ghost-btn danger">시연 데이터 초기화</button>
    </div>
    <button class="sheet-close" data-close="settingsSheet">닫기</button>
  </div>
</div>

<!-- 목표 수정 -->
<div id="goalSheet" class="sheet-backdrop" hidden>
  <div class="sheet">
    <div class="sheet-handle"></div>
    <h2 id="goalTitle">목표 수정</h2>
    <label class="field">
      <span>목표 내용</span>
      <input id="goalText" type="text" placeholder="예: 매주 블로그 1회" autocomplete="off">
    </label>
    <label class="field">
      <span>이번 달 총 목표 횟수</span>
      <input id="goalTotal" type="number" min="1" max="31" inputmode="numeric">
      <small>주차 체크 수 ÷ 총 목표 = 달성률</small>
    </label>
    <div class="row-actions">
      <button class="ghost-btn" data-close="goalSheet">취소</button>
      <button id="goalSaveBtn" class="primary-btn">저장</button>
    </div>
  </div>
</div>

<!-- 참여자 추가 -->
<div id="addSheet" class="sheet-backdrop" hidden>
  <div class="sheet">
    <div class="sheet-handle"></div>
    <h2>참여자 추가</h2>
    <label class="field">
      <span>이름</span>
      <input id="addName" type="text" placeholder="이름" autocomplete="off">
    </label>
    <label class="field">
      <span>목표 내용</span>
      <input id="addGoal" type="text" placeholder="예: 매주 유튜브 1개" autocomplete="off">
    </label>
    <label class="field">
      <span>이번 달 총 목표 횟수</span>
      <input id="addTotal" type="number" min="1" max="31" value="5" inputmode="numeric">
    </label>
    <div class="row-actions">
      <button class="ghost-btn" data-close="addSheet">취소</button>
      <button id="addSaveBtn" class="primary-btn">추가</button>
    </div>
  </div>
</div>

<!-- 다음 달 이월 -->
<div id="rollSheet" class="sheet-backdrop" hidden>
  <div class="sheet">
    <div class="sheet-handle"></div>
    <h2>다음 달 이월 미리보기</h2>
    <p id="rollSummary" class="roll-summary"></p>
    <div id="rollList" class="roll-list"></div>
    <div class="row-actions">
      <button class="ghost-btn" data-close="rollSheet">닫기</button>
      <button id="rollConfirmBtn" class="primary-btn">다음 달 시트 만들기</button>
    </div>
    <p class="tiny">연장여부가 체크된 참가자만 새 달로 넘어갑니다. 원본 시트의 지난 달 데이터는 그대로 남습니다.</p>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<script src="assets/snapshot.js?v=20261119a"></script>
<script src="assets/app.js?v=20261119a"></script>
</body>
</html>
